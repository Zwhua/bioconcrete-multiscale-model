name: model-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile and test
        run: |
          python -m compileall -q bioconcrete
          python -m unittest discover -s tests -v
          git diff --check
      - name: Validate configuration files
        run: |
          python -c "import json,yaml; json.load(open('model_config.json')); yaml.safe_load(open('PREREGISTERED_SCENARIOS.yml')); yaml.safe_load(open('PROSPECTIVE_PREDICTIONS.yml'))"
          python -c "from pathlib import Path; text='\n'.join(p.read_text(encoding='utf-8',errors='ignore') for p in Path('.').rglob('*') if p.is_file() and p.suffix in {'.md','.yml','.yaml'}); assert 'public-data-supported prediction' not in text"
      - name: CLI smoke tests
        run: |
          python -m bioconcrete audit-units --output model_runs/ci-unit-audit.csv
          python -m unittest tests.test_experiment_design -v
          python -m bioconcrete dashboard --output model_runs/ci-dashboard
      - name: Run quick physical validation
        run: python -m bioconcrete validate --config model_config.json --output model_runs/ci-validation
