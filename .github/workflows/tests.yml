name: model-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Compile and test
        run: |
          python -m compileall -q bioconcrete
          python -m unittest discover -s tests -v
      - name: Run quick physical validation
        run: python -m bioconcrete validate --config model_config.json --output model_runs/ci-validation

