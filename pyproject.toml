[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-bioconcrete"
version = "0.3.0"
description = "Multiscale reactive-transport model for microbial self-healing concrete"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "requests>=2.28",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "SALib>=1.4.7,<1.5",
]

[project.scripts]
bioconcrete = "bioconcrete.cli:main"

[tool.setuptools.packages.find]
include = ["bioconcrete*"]
