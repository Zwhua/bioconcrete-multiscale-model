[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-bioconcrete"
version = "0.1.0"
description = "Multiscale reactive-transport model for microbial self-healing concrete"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
]

[project.scripts]
bioconcrete = "bioconcrete.cli:main"

[tool.setuptools.packages.find]
include = ["bioconcrete*"]

