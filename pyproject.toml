[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "igem-bioconcrete"
version = "0.5.1"
description = "Multiscale reactive-transport model for microbial self-healing concrete"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "pandas>=2.0,<3",
  "matplotlib>=3.7,<4",
  "plotly>=5.18,<6",
  "requests>=2.28",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "SALib>=1.4.7,<1.5",
]

[project.optional-dependencies]
three-d = ["xarray>=2022.6,<2024; python_version<'3.9'", "xarray>=2023.1; python_version>='3.9'", "zarr>=2.13,<3", "numcodecs>=0.10"]
visualization-3d = ["pyvista>=0.39"]
hpc = ["mpi4py", "petsc4py"]

[project.scripts]
bioconcrete = "bioconcrete.cli:main"

[tool.setuptools.packages.find]
include = ["bioconcrete*"]
